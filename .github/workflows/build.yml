on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (optional)
        required: false
name: Build Workflow
permissions:
  contents: read
  checks: write
  pull-requests: write
jobs:
  build-web-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: build-time-dummy-secret
          AUTH_KEYCLOAK_ID: dummy
          AUTH_KEYCLOAK_SECRET: dummy
          AUTH_KEYCLOAK_ISSUER: https://keycloak.example/realms/spexregister
          API_GRAPHQL_ENDPOINT: https://api.example/api/graphql
          API_REST_BASE_URL: https://api.example
          BETTER_AUTH_URL: https://app.example
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            test-results/*.xml
      - name: Publish coverage report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  e2e-web-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Publish Playwright test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: Playwright Test Results
          files: |
            test-results/e2e-results.xml
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  publish-image:
    needs: [ build-web-project, e2e-web-project ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v7
      - name: Determine image tags
        id: image
        run: |
          repo=bloomper/spexregister-web
          sha=sha-${GITHUB_SHA::7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(node -p "require('./package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
              exit 1
            fi
            if docker manifest inspect "$repo:$version" > /dev/null 2>&1; then
              echo "::error::$repo:$version already exists on Docker Hub"
              exit 1
            fi
            echo "tags=$repo:$version,$repo:latest,$repo:$sha" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$repo:develop,$repo:$sha" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
