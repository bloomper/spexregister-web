name: spexregister-web

services:
  web:
    container_name: web-app
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/caddy-root.crt
      - BETTER_AUTH_URL=https://register.fgv.local.nu
      - API_GRAPHQL_ENDPOINT=https://api.register.fgv.local.nu:8443/api/graphql
      - API_REST_BASE_URL=https://api.register.fgv.local.nu:8443
      - KEYCLOAK_ISSUER=https://auth.fgv.local.nu:8443/auth/realms/fgv
    env_file:
      - .env
      - .env.local
    extra_hosts:
      - "register.fgv.local.nu:host-gateway"
      - "auth.fgv.local.nu:host-gateway"
      - "api.register.fgv.local.nu:host-gateway"
    restart: always
    volumes:
      - ${INFRA_DEPLOY:-../fgv-infra-deploy}/local/.docker/caddy/data/caddy/pki/authorities/local/root.crt:/usr/local/share/ca-certificates/caddy-root.crt:ro
      - web_app_static:/app/.next/static
      - web_app_public:/app/public
    networks:
      - web_network

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      web:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - web_app_static:/app/_next/static:ro
      - web_app_public:/app/public:ro
    networks:
      web_network:
        aliases:
          - register.fgv.local.nu

volumes:
  caddy_data:
    driver: local
    driver_opts:
      type: none
      device: .docker/caddy/data
      o: bind
  caddy_config:
    driver: local
    driver_opts:
      type: none
      device: .docker/caddy/config
      o: bind
  web_app_static:
  web_app_public:

networks:
  web_network:
    driver: bridge
